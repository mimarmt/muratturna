<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1a1c"/><stop offset="0.5" stop-color="#232326"/><stop offset="1" stop-color="#121213"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0e0f"/><stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB24D" stop-opacity="0.85"/><stop offset="1" stop-color="#FF8A1F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="slit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE2B0"/><stop offset="0.6" stop-color="#FFB24D"/><stop offset="1" stop-color="#FF9A2E"/>
    </linearGradient>
    <filter id="blur" x="-200%" y="-20%" width="500%" height="140%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#wall)"/>
  <rect y="760" width="1024" height="264" fill="url(#floor)"/>
  <!-- light spilling on the floor -->
  <polygon points="498,760 526,760 760,1024 264,1024" fill="url(#spill)" filter="url(#soft)"/>
  <!-- glow of the slit -->
  <rect x="470" y="170" width="84" height="590" fill="#FFA53D" opacity="0.55" filter="url(#blur)"/>
  <!-- the slit itself -->
  <rect x="500" y="170" width="24" height="590" rx="3" fill="url(#slit)"/>
</svg>
