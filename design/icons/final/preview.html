<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#f2f2f4;font-family:-apple-system,Helvetica,Arial,sans-serif;color:#1c1c1e;padding:36px}
h1{font-family:Georgia,serif;margin:0 0 4px;font-size:34px}.sub{color:#6e6e73;margin:0 0 28px}
.wrap{display:flex;gap:28px}.card{background:#fff;border-radius:28px;padding:26px;width:380px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
h2{margin:0 0 18px;font-size:19px}.big{width:300px;height:300px;border-radius:67px;overflow:hidden;margin:0 auto 22px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
img{width:100%;height:100%;display:block}.row{display:flex;align-items:flex-end;justify-content:center;gap:22px;padding:18px;border-radius:18px}
.l{background:linear-gradient(135deg,#c9d6e8,#e9e1d6)}.d{background:#000;margin-top:12px}.s{overflow:hidden}
.a{width:60px;height:60px;border-radius:13.5px}.b{width:40px;height:40px;border-radius:9px}.c{width:29px;height:29px;border-radius:6.5px}
.tint img{filter:sepia(1) saturate(3) hue-rotate(160deg) brightness(.95)}
</style></head><body><h1>Loopnote · App Icon</h1><p class="sub">Final · Cam Küre — koyu, açık ve renkli (tinted) modlar</p><div class="wrap">
<div class="card "><h2>Koyu (varsayılan)</h2><div class="big"><img src="loopnote-icon-dark.svg"></div>
<div class="row l"><div class="s a"><img src="loopnote-icon-dark.svg"></div><div class="s b"><img src="loopnote-icon-dark.svg"></div><div class="s c"><img src="loopnote-icon-dark.svg"></div></div>
<div class="row d"><div class="s a"><img src="loopnote-icon-dark.svg"></div><div class="s b"><img src="loopnote-icon-dark.svg"></div><div class="s c"><img src="loopnote-icon-dark.svg"></div></div></div>
<div class="card "><h2>Açık</h2><div class="big"><img src="loopnote-icon-light.svg"></div>
<div class="row l"><div class="s a"><img src="loopnote-icon-light.svg"></div><div class="s b"><img src="loopnote-icon-light.svg"></div><div class="s c"><img src="loopnote-icon-light.svg"></div></div>
<div class="row d"><div class="s a"><img src="loopnote-icon-light.svg"></div><div class="s b"><img src="loopnote-icon-light.svg"></div><div class="s c"><img src="loopnote-icon-light.svg"></div></div></div>
<div class="card tint"><h2>Renkli (tinted) – örnek mavi ton</h2><div class="big"><img src="loopnote-icon-tinted.svg"></div>
<div class="row l"><div class="s a"><img src="loopnote-icon-tinted.svg"></div><div class="s b"><img src="loopnote-icon-tinted.svg"></div><div class="s c"><img src="loopnote-icon-tinted.svg"></div></div>
<div class="row d"><div class="s a"><img src="loopnote-icon-tinted.svg"></div><div class="s b"><img src="loopnote-icon-tinted.svg"></div><div class="s c"><img src="loopnote-icon-tinted.svg"></div></div></div>
</div></body></html>
