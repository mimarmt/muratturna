<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#f2f2f4;font-family:-apple-system,Helvetica,Arial,sans-serif;color:#1c1c1e}
.wrap{display:flex;gap:28px;padding:36px}
.card{background:#fff;border-radius:28px;padding:28px;width:380px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
h2{margin:0 0 4px;font-family:Georgia,serif;font-size:26px}
p{margin:0 0 20px;color:#6e6e73;font-size:15px}
.big{width:300px;height:300px;border-radius:67px;overflow:hidden;margin:0 auto 24px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.big img,.s img{width:100%;height:100%;display:block}
.row{display:flex;align-items:flex-end;justify-content:center;gap:22px;padding:18px;border-radius:18px}
.row.dark{background:#000;margin-top:12px}
.row.light{background:linear-gradient(135deg,#c9d6e8,#e9e1d6)}
.s{overflow:hidden}
.s60{width:60px;height:60px;border-radius:13.5px}
.s40{width:40px;height:40px;border-radius:9px}
.s29{width:29px;height:29px;border-radius:6.5px}
.lbl{font-size:12px;color:#8e8e93;text-align:center;margin-top:8px}
</style></head><body><div class="wrap">
<div class="card"><h2>A · Döngü + Ses Dalgası</h2><p>Tekrar eden halka, içinde canlı ses</p>
<div class="big"><img src="icon-a-loop.svg"></div>
<div class="row light"><div class="s s60"><img src="icon-a-loop.svg"></div><div class="s s40"><img src="icon-a-loop.svg"></div><div class="s s29"><img src="icon-a-loop.svg"></div></div>
<div class="row dark"><div class="s s60"><img src="icon-a-loop.svg"></div><div class="s s40"><img src="icon-a-loop.svg"></div><div class="s s29"><img src="icon-a-loop.svg"></div></div>
<div class="lbl">Ana ekran · Ayarlar · Bildirim boyutları</div></div>
<div class="card"><h2>B · Işık Yarığı</h2><p>Kapı aralığından sızan amber ışık</p>
<div class="big"><img src="icon-b-light.svg"></div>
<div class="row light"><div class="s s60"><img src="icon-b-light.svg"></div><div class="s s40"><img src="icon-b-light.svg"></div><div class="s s29"><img src="icon-b-light.svg"></div></div>
<div class="row dark"><div class="s s60"><img src="icon-b-light.svg"></div><div class="s s40"><img src="icon-b-light.svg"></div><div class="s s29"><img src="icon-b-light.svg"></div></div>
<div class="lbl">Ana ekran · Ayarlar · Bildirim boyutları</div></div>
<div class="card"><h2>C · Katlanmış Kâğıt</h2><p>Not kâğıdı, kıvrımda amber ışık</p>
<div class="big"><img src="icon-c-paper.svg"></div>
<div class="row light"><div class="s s60"><img src="icon-c-paper.svg"></div><div class="s s40"><img src="icon-c-paper.svg"></div><div class="s s29"><img src="icon-c-paper.svg"></div></div>
<div class="row dark"><div class="s s60"><img src="icon-c-paper.svg"></div><div class="s s40"><img src="icon-c-paper.svg"></div><div class="s s29"><img src="icon-c-paper.svg"></div></div>
<div class="lbl">Ana ekran · Ayarlar · Bildirim boyutları</div></div>
</div></body></html>
