<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F3EE"/><stop offset="1" stop-color="#DCD6CD"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EDE9E3"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE0A8"/><stop offset="1" stop-color="#F29A2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFA53D" stop-opacity="0.75"/><stop offset="1" stop-color="#FFA53D" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="18" dy="30" stdDeviation="30" flood-color="#3a2f22" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="700" cy="700" r="230" fill="url(#glow)"/>
  <path d="M 262 232 L 762 232 L 762 582 L 612 792 L 262 792 Z" fill="url(#paper)" filter="url(#shadow)"/>
  <!-- folded corner -->
  <path d="M 762 582 L 612 792 L 640 610 Z" fill="url(#fold)"/>
  <!-- note lines -->
  <g stroke="#1c1c1e" stroke-linecap="round">
    <line x1="342" y1="352" x2="682" y2="352" stroke-width="22" stroke-opacity="0.85"/>
    <line x1="342" y1="452" x2="622" y2="452" stroke-width="14" stroke-opacity="0.35"/>
    <line x1="342" y1="532" x2="582" y2="532" stroke-width="14" stroke-opacity="0.35"/>
    <line x1="342" y1="612" x2="522" y2="612" stroke-width="14" stroke-opacity="0.35"/>
  </g>
</svg>
