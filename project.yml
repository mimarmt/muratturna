name: Loopnote
options:
  bundleIdPrefix: com.muratturna
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: RQ82R94TUH
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  LoopnoteCore:
    path: Packages/LoopnoteCore

targets:
  Loopnote:
    type: application
    platform: iOS
    sources:
      - path: App/Loopnote
    dependencies:
      - package: LoopnoteCore
    info:
      path: App/Loopnote/Info.plist
      properties:
        CFBundleDisplayName: Loopnote
        CFBundleLocalizations: [en, tr, de]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.muratturna.loopnote.replan]
        NSMicrophoneUsageDescription: Loopnote uses the microphone so you can dictate notes.
        NSSpeechRecognitionUsageDescription: Loopnote turns your voice into text on your device.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muratturna.loopnote
        # CI overrides these for App Store signing; local builds stay automatic.
        CODE_SIGN_STYLE: "$(LN_SIGN_STYLE:default=Automatic)"
        CODE_SIGN_IDENTITY: "$(LN_SIGN_IDENTITY:default=Apple Development)"
        PROVISIONING_PROFILE_SPECIFIER: "$(LN_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Loopnote

schemes:
  Loopnote:
    build:
      targets:
        Loopnote: all
    run:
      config: Debug
    archive:
      config: Release
