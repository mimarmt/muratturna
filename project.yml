name: Loopnote
options:
  bundleIdPrefix: com.muratturna
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: RQ82R94TUH
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  LoopnoteCore:
    path: Packages/LoopnoteCore
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.18.2
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1

targets:
  Loopnote:
    type: application
    platform: iOS
    sources:
      - path: App/Loopnote
      - path: App/Shared
    dependencies:
      - package: LoopnoteCore
      - package: FluidAudio
      - package: ArgmaxOSS
        product: WhisperKit
      - target: LoopnoteWidgets
      - target: LoopnoteWatch
    entitlements:
      path: App/Loopnote/Loopnote.entitlements
      properties:
        com.apple.security.application-groups: [group.com.muratturna.loopnote]
    info:
      path: App/Loopnote/Info.plist
      properties:
        CFBundleDisplayName: Loopnote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, tr, de]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch, audio, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.muratturna.loopnote.replan, com.muratturna.loopnote.meeting.*]
        NSMicrophoneUsageDescription: Loopnote uses the microphone so you can dictate notes.
        NSSpeechRecognitionUsageDescription: Loopnote turns your voice into text on your device.
        NSCameraUsageDescription: Loopnote uses the camera so you can add a photo to a note.
        NSLocationWhenInUseUsageDescription: Loopnote reminds you when you arrive at or leave a place you choose.
        NSAlarmKitUsageDescription: Critical notes ring as alarms so you hear them even in Silent mode.
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muratturna.loopnote
        # CI overrides these for App Store signing; local builds stay automatic.
        CODE_SIGN_STYLE: "$(LN_SIGN_STYLE:default=Automatic)"
        CODE_SIGN_IDENTITY: "$(LN_SIGN_IDENTITY:default=Apple Development)"
        PROVISIONING_PROFILE_SPECIFIER: "$(LN_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Loopnote

  LoopnoteWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/LoopnoteWidgets
      - path: App/Shared
    entitlements:
      path: App/LoopnoteWidgets/LoopnoteWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.muratturna.loopnote]
    info:
      path: App/LoopnoteWidgets/Info.plist
      properties:
        CFBundleDisplayName: Loopnote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muratturna.loopnote.widgets
        CODE_SIGN_STYLE: "$(LN_SIGN_STYLE:default=Automatic)"
        CODE_SIGN_IDENTITY: "$(LN_SIGN_IDENTITY:default=Apple Development)"
        PROVISIONING_PROFILE_SPECIFIER: "$(LN_WIDGET_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  LoopnoteWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: App/LoopnoteWatch
      - path: App/Shared/WatchPayload.swift
    info:
      path: App/LoopnoteWatch/Info.plist
      properties:
        CFBundleDisplayName: Loopnote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.muratturna.loopnote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muratturna.loopnote.watchkitapp
        CODE_SIGN_STYLE: "$(LN_SIGN_STYLE:default=Automatic)"
        CODE_SIGN_IDENTITY: "$(LN_SIGN_IDENTITY:default=Apple Development)"
        PROVISIONING_PROFILE_SPECIFIER: "$(LN_WATCH_PROFILE)"
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES

  LoopnoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/LoopnoteUITests
    dependencies:
      - target: Loopnote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muratturna.loopnote.uitests
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: Loopnote

schemes:
  Loopnote:
    build:
      targets:
        Loopnote: all
    test:
      targets:
        - LoopnoteUITests
    run:
      config: Debug
    archive:
      config: Release
